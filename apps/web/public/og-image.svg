<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b0d12" />
  <!-- Brand mark: rounded terminal window -->
  <rect x="180" y="130" width="420" height="370" rx="24" fill="#11151d" />
  <rect x="180" y="130" width="420" height="52" rx="24" fill="#171c26" />
  <circle cx="214" cy="156" r="8" fill="#ff5f56" />
  <circle cx="240" cy="156" r="8" fill="#feb244" />
  <circle cx="266" cy="156" r="8" fill="#28ca42" />
  <text x="260" y="200" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600">webssh@studio:~</text>
  <text x="260" y="232" fill="#70DFE3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">$ _</text>
