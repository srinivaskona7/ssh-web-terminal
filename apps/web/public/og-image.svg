  <text x="210" y="330" fill="#9da7b3" font-family="system-ui, -apple-system, sans-serif" font-size="22">WebSSH Studio</text>
  <text x="210" y="370" fill="#9da7b3" font-family="system-ui, -apple-system, sans-serif" font-size="16">Browser SSH Terminal &amp; SFTP Studio</text>
  <text x="210" y="410" fill="#4f8cff" font-family="system-ui, -apple-system, sans-serif" font-size="14">Non-extractable keys · No billing · No tracking</text>
