app = "webssh-studio-gateway"
primary_region = "iad"

[build]
  dockerfile = "../docker/Dockerfile"

[env]
  LISTEN_ADDR = ":8080"
  SESSION_GRACE = "15m"
  RING_BUFFER_BYTES = "4194304"
  MAX_SESSIONS_PER_USER = "10"
  RATE_LIMITS = "30"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"
