name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-and-protocol:
    name: Token Build, Lint, Typecheck & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build design tokens
        run: npm run tokens:build

      - name: Lint design token usage (no hardcoded values)
        run: npm run lint:tokens

      - name: Lint stylesheets (no unknown CSS properties)
        run: npm run lint:css

      - name: Check line endings (LF only)
        run: npm run lint:eol

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run unit & property tests with coverage gate
        run: npm run test:coverage

      - name: Build production web client
        run: npm run build

  gateway:
    name: Go Gateway Unit, Fuzz & SSH Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # 1.27.4 is the first release that carries the net/http fix for GO-2026-6859.
          go-version: "1.27.4"
          cache-dependency-path: apps/gateway/go.sum

      - name: Run Go vet & tests with race detector and coverage gate
        working-directory: apps/gateway
        run: |
          go vet ./...
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

  e2e:
    name: Playwright Cross-Browser E2E & Accessibility
    runs-on: ubuntu-24.04
    needs: [web-and-protocol, gateway]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # 1.27.4 is the first release that carries the net/http fix for GO-2026-6859.
          go-version: "1.27.4"
          cache-dependency-path: apps/gateway/go.sum

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build tokens & web bundle
        env:
          VITE_BASE_PATH: /ssh-web-terminal/
        run: npm run build

      - name: Run Playwright suite (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
