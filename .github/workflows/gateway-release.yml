name: Gateway Release & Deploy

on:
  push:
    tags:
      - "gateway-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-sign-push:
    name: Build Multi-Arch Image, SBOM & Cosign
    runs-on: ubuntu-24.04
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ghcr.io/${{ github.repository }}/gateway:${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch distroless gateway image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}/gateway:${{ github.ref_name }}

      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/gateway@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: gateway-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign container image with keyless OIDC Cosign
        run: cosign sign --yes ghcr.io/${{ github.repository }}/gateway@${{ steps.build.outputs.digest }}

  deploy-fly:
    name: Deploy Gateway to Fly.io & Smoke Test
    needs: build-sign-push
    runs-on: ubuntu-24.04
    if: ${{ secrets.FLY_API_TOKEN != '' }}
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy image to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config deploy/fly/fly.toml --image "${{ needs.build-sign-push.outputs.image_tag }}"

      - name: Run post-deploy health & WebSocket smoke check
        env:
          GATEWAY_HEALTH_URL: ${{ vars.GATEWAY_HEALTH_URL || 'https://gateway.webssh.studio/healthz' }}
        run: |
          curl -fsSL "$GATEWAY_HEALTH_URL"
