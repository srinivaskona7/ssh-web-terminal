name: Security Scans & Supply Chain

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL SAST (JS/TS & Go)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, go]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: npm audit & govulncheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # 1.27.4 is the first release that carries the net/http fix for GO-2026-6859.
          go-version: "1.27.4"
          cache-dependency-path: apps/gateway/go.sum

      - name: Run npm audit (high/critical production gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Run govulncheck
        working-directory: apps/gateway
        run: |
          # Pinned so the scanner cannot drift past the Go toolchain in this workflow.
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
